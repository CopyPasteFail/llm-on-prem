apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-serving.fullname" . }}-litellm
  namespace: {{ include "llm-serving.namespace" . }}
  labels:
    {{- include "llm-serving.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  replicas: {{ .Values.litellm.replicaCount }}
  selector:
    matchLabels:
      {{- include "llm-serving.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: litellm
  template:
    metadata:
      labels:
        {{- include "llm-serving.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: litellm
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "llm-serving.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: litellm
          image: {{ printf "%s@%s" .Values.litellm.image.repository .Values.litellm.image.digest | quote }}
          imagePullPolicy: {{ .Values.litellm.image.pullPolicy }}
          command: ["litellm"]
          args:
            - "--config"
            - "/app/config/config.yaml"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.litellm.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.litellm.port }}
              protocol: TCP
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.existingSecret.name }}
                  key: {{ .Values.litellm.existingSecret.masterKeyKey }}
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.existingSecret.name }}
                  key: {{ .Values.litellm.existingSecret.vllmApiKeyKey }}
            {{- if .Values.litellm.database.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.existingSecret.name }}
                  key: {{ .Values.litellm.database.urlKey }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          resources:
            {{- toYaml .Values.litellm.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: {{ include "llm-serving.fullname" . }}-litellm-config
