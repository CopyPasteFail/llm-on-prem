apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-serving.fullname" . }}-vllm
  namespace: {{ include "llm-serving.namespace" . }}
  labels:
    {{- include "llm-serving.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.vllm.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "llm-serving.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
