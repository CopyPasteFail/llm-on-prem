stages:
  - validate

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

variables:
  CHART_DIR: charts/llm-serving
  GX10_VALUES: charts/llm-serving/values/gx10.yaml

helm_validate:
  stage: validate
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  interruptible: true
  script:
    - sh scripts/check-gitops-layout.sh
    - helm lint "$CHART_DIR" --values "$GX10_VALUES"
    - mkdir -p rendered
    - helm template llm-serving "$CHART_DIR" --namespace llm-serving --values "$GX10_VALUES" > rendered/llm-serving.yaml
    - test -s rendered/llm-serving.yaml
    - sh scripts/check-rendered-manifest.sh rendered/llm-serving.yaml
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - rendered/llm-serving.yaml
  rules:
    - changes:
        - .gitlab-ci.yml
        - charts/**/*
        - argocd/**/*
        - scripts/**/*
        - docs/**/*

# Validation only: this repository has no direct Kubernetes deployment job.
